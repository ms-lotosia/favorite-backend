spring.application.name=favorite-service
server.port=8084

# ─── Database ───────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/lotosia_favorite
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Flyway ─────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── Catalog Service Integration ────────────────────────────────
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8080}
catalog.service.connect-timeout-ms=3000
catalog.service.read-timeout-ms=5000

# ─── JWT (same secret as identity-service for token validation) ──
jwt.secret=${JWT_SECRET}

# ─── Actuator ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ─── OpenAPI / Swagger ──────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.security-definitions.bearerAuth.type=http
springdoc.swagger-ui.security-definitions.bearerAuth.scheme=bearer
springdoc.swagger-ui.security-definitions.bearerAuth.bearer-format=JWT
